# Apache2 reverse proxy for Acoustics suite (HTTPS + WSS)
#
# Serves one public origin:
#   https://app-gevelwering.example.com/     → Node UI (127.0.0.1:4173)
#   https://app-gevelwering.example.com/api/ → Node APIs
#   https://app-gevelwering.example.com/ws   → bppServer WebSocket (127.0.0.1:18080)
#
# Required modules:
#   a2enmod ssl headers proxy proxy_http proxy_wstunnel rewrite
#
# Certs (Let's Encrypt example):
#   certbot --apache -d app-gevelwering.example.com
#
# Backend processes (loopback only):
#   bppServer --server --port 18080
#   GEVELWERING_UI_PORT=4173 node serve.mjs
#
# Production env (examples):
#   BPP_WS_ORIGIN_ALLOWLIST=https://app-gevelwering.example.com
#   GEVELWERING_CORS_ORIGIN=https://app-gevelwering.example.com
#   GEVELWERING_REQUIRE_HTTPS=1

<VirtualHost *:80>
    ServerName app-gevelwering.example.com

    RewriteEngine On
    RewriteRule ^/(.*)$ https://%{HTTP_HOST}/$1 [R=301,L]
</VirtualHost>

<VirtualHost *:443>
    ServerName app-gevelwering.example.com

    SSLEngine on
    SSLCertificateFile /etc/letsencrypt/live/app-gevelwering.example.com/fullchain.pem
    SSLCertificateKeyFile /etc/letsencrypt/live/app-gevelwering.example.com/privkey.pem

    ProxyRequests Off
    ProxyPreserveHost On
    RequestHeader set X-Forwarded-Proto "https"
    RequestHeader set X-Forwarded-Port "443"

    # WebSocket to bppServer (must be before the catch-all / proxy)
    ProxyPass /ws ws://127.0.0.1:18080/ws retry=0 timeout=3600
    ProxyPassReverse /ws ws://127.0.0.1:18080/ws

    # UI + HTTP APIs (Node client/serve.mjs)
    ProxyPass / http://127.0.0.1:4173/ retry=0 timeout=120 keepalive=On
    ProxyPassReverse / http://127.0.0.1:4173/

    # Transport hardening
    Header always set Strict-Transport-Security "max-age=31536000; includeSubDomains"
    Header always set X-Content-Type-Options "nosniff"
    Header always set X-Frame-Options "DENY"
    Header always set Referrer-Policy "no-referrer"
    # pdf.js may load from CDN on engineer/floormap pages — keep connect-src self for app APIs/WS
    Header always set Content-Security-Policy "default-src 'self'; script-src 'self' https://cdnjs.cloudflare.com; style-src 'self' 'unsafe-inline'; connect-src 'self'; img-src 'self' data: blob:; worker-src 'self' blob:; frame-ancestors 'none'; base-uri 'self'; form-action 'self'"

    ErrorLog ${APACHE_LOG_DIR}/app-gevelwering-error.log
    CustomLog ${APACHE_LOG_DIR}/app-gevelwering-access.log combined
</VirtualHost>
